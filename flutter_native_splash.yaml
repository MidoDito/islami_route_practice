flutter_native_splash:
#flutter_native_splash:

  #======================================================================
  # Uncomment this if you want to disable this package for specific platform:
  # android: true
  # ios: true
  # web: true
  #======================================================================

  #! FOR ALL PLATFORMS, except Android 12+:

  # Use solid background color (required)
  color: "#202020"   ##====================================[REQUIRED]==========

  # Platform-specific colors (optional, but consistent)
  color_android: "#202020"
  color_ios: "#202020"
  color_web: "#202020"

  # Splash logo image (shown above background color)
  image: assets/images/splash_logo.png
  image_android: assets/images/splash_logo.png
  image_ios: assets/images/splash_logo.png
  image_web: assets/images/splash_logo.png

  # Branding (optional, shown at bottom)
  branding: assets/images/branding_logo.png
  branding_android: assets/images/branding_logo.png
  branding_ios: assets/images/branding_logo.png
  branding_web: assets/images/branding_logo.png

  # Branding position and padding
  branding_mode: bottom
  branding_bottom_padding: 24
  branding_bottom_padding_android: 24
  branding_bottom_padding_ios: 24

  # Hide notification bar on Android
  fullscreen: true

  #========================================================================
  #! ANDROID 12+ configuration:
  android_12:
    # Background color
    color: "#202020"

    # Center logo (required for Android 12 splash)
    image: assets/images/splash_n_logo.png

    # Background color behind circular mask
    icon_background_color: "#202020"

    # Branding image (must be 800x320 px)
    branding: assets/images/branding_splash.png

  

  

